
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test and Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn scikit-learn joblib pytest httpx ruff

      - name: Train model
        run: python src/train/train.py

      - name: Run tests
        env:
          PYTHONPATH: .
        run: python -m pytest -v

      - name: Run lint
        run: ruff check src tests


